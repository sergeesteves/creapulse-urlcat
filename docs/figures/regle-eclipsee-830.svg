<svg viewBox="0 0 720 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="regle-eclipsee-title regle-eclipsee-desc"><title id="regle-eclipsee-title">Premier motif gagnant et règle éclipsée</title><desc id="regle-eclipsee-desc">Une URL est confrontée aux règles d'un fichier de catégorisation dans l'ordre. La règle 8 ne correspond pas, la règle 12 correspond et emporte le classement, et le balayage s'arrête là : la règle 27, qui correspondrait aussi, n'est jamais atteinte et ne classe donc aucune URL.</desc><defs><marker id="regle-eclipsee-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#595959"/></marker><marker id="regle-eclipsee-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#027dba"/></marker><marker id="regle-eclipsee-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e61781"/></marker></defs><rect x="0.5" y="0.5" width="719" height="451" fill="#f7f7f7" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><line x1="332" y1="80" x2="332" y2="118" stroke="#027dba" stroke-width="1.5" marker-end="url(#regle-eclipsee-arrow-main)"/><line x1="332" y1="184" x2="332" y2="214" stroke="#027dba" stroke-width="1.5" marker-end="url(#regle-eclipsee-arrow-main)"/><line x1="504" y1="248" x2="534" y2="248" stroke="#027dba" stroke-width="1.5" marker-end="url(#regle-eclipsee-arrow-main)"/><line x1="332" y1="280" x2="332" y2="294" stroke="#595959" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="314" y1="296" x2="350" y2="296" stroke="#595959" stroke-width="2"/><rect x="356" y="286" width="124" height="16" rx="2" fill="#f7f7f7"/><text x="360" y="299" fill="#595959" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.06em">LE SCAN S'ARRÊTE</text><path d="M 160 344 H 136 A 8 8 0 0 1 128 336 V 60 A 8 8 0 0 1 136 