<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titre %}urlcat{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="{{ prefixe }}/static/urlcat.css">
</head>
<body class="{% if embed %}embarque{% endif %}">
<main>
{% block contenu %}{% endblock %}
</main>
<script>
// Auto-hauteur de l'iframe : le plugin n'accepte le message que s'il vient de cette iframe
// et de l'origine du src, et borne la valeur a 200-3000 px. On se borne aussi ici.
(function () {
  if (window.parent === window) return;
  var dernier = 0;
  function annoncer() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    h = Math.min(3000, Math.max(200, Math.ceil(h) + 8));
    if (Math.abs(h - dernier) < 8) return;
    dernier = h;
    window.parent.postMessage({ type: 'vsg-height', height: h }, '*');
  }
  window.addEventListener('load', annoncer);
  window.addEventListener('resize', annoncer);
  if (window.ResizeObserver) new ResizeObserver(annoncer).observe(document.body);
  setTimeout(annoncer, 60);
})();
</script>
</body>
</html>
